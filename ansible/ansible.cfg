# Run from this folder:  ansible-playbook site.yml
[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
# The vault password file is NOT in Git (.gitignore: vault-password*). Create it once, see README.
vault_password_file  = vault-password.txt
retry_files_enabled  = False
interpreter_python   = auto_silent
result_format        = yaml
