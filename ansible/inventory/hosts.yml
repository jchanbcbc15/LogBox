# The demo target is this machine (Docker in WSL), reached over a local connection.
# Nothing in the playbook assumes localhost: to deploy to another server, add a host here with
# ansible_host / ansible_user and (if needed) ansible_become. Prerequisites on that server: Docker
# Engine running and the connecting user allowed to use it; the sample files are copied from this
# controller by the playbook.
all:
  hosts:
    demo-host:
      ansible_connection: local
