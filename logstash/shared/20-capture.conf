# 20-capture.conf — keep a copy of the raw record and the ingest time before parse overwrites
# @timestamp.
#
# This file writes:
#   ECS event.original  — message after stripping carriage returns
#   ECS event.created   — copy of @timestamp (still the ingest clock)
#
# This file also removes:
#   host — by default the file input sets host.name to the Logstash/container host. Firewall
#     and proxy parse never set host.name, so that container host would stay on the document
#     and look like the origin (related.hosts would copy it too). A failed syslog parse would
#     keep it as well. Collector identity is stored later as ECS agent.name and metadata
#     org.metadata.pipeline.host (85-collector.conf).
#   @version — Logstash always sets it to "1"; it is unused.
#
# The id => values below are labels in Logstash logs. They are not written onto the event.
filter {
  mutate {
    id => "common.original.strip_cr"
    gsub => ["message", "\r", ""]
  }
  mutate {
    id => "common.original.copy"
    copy => { "message" => "[event][original]" }
  }
  mutate {
    id => "common.created"
    copy => { "@timestamp" => "[event][created]" }
  }
  mutate {
    id => "common.drop_internals"
    remove_field => ["[host]", "@version"]
  }
}
