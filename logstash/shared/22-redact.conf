# 22-redact.conf — mask credential values on ECS message before any source parses it.
#
# This file changes one field: ECS message. The key stays; the value becomes [REDACTED].
# Depends on 20-capture: ECS event.original is already copied and stays unredacted.
# Parse reads message, so mapped fields and org.metadata.* inherit the masking.
#
# Keys: password, passwd, passphrase, secret, token, api_key, access_key, Authorization: Bearer.
# A match needs "=" or ":" after the key, so "Failed password for" is left alone.
# The value runs to the next space, comma, semicolon, ampersand, quote or pipe.
#
# The id => below is a label in Logstash logs. It is not written onto the event.
filter {
  mutate {
    id => "common.redact.keyvalue"
    gsub => [
      "message", '(?i)\b((?:password|passwd|passphrase|secret|token|api_key|access_key)\\?\s*[=:]\s*["\x27]*)[^\s,;&"\x27|]+', '\1[REDACTED]',
      "message", '(?i)\b(authorization\s*:\s*bearer\s+)[^\s,;&"\x27|]+', '\1[REDACTED]'
    ]
  }
}
