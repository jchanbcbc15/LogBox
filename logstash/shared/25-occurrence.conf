# 25-occurrence.conf — count how many times this exact raw line has already been seen in this run
# so two identical lines can still get two document ids.
#
# This file writes one value: Logstash-internal [@metadata][occurrence]
# (0 the first time, 1 the second, …). Dropped at output; 60-doc-id.conf hashes it into _id.
#
# Depends on 20-capture: the lookup key is ECS event.original.
# Ruby keeps a table across events (built-in filters cannot). A mutex keeps the count
# right with more than one worker.
#
# The id => below is a label in Logstash logs. It is not written onto the event.
filter {
  ruby {
    id   => "common.occurrence"
    init => '@lock = Mutex.new; @seen = Hash.new(0)'
    code => '
      key = event.get("[event][original]").to_s
      occ = nil
      @lock.synchronize { occ = @seen[key]; @seen[key] += 1 }
      event.set("[@metadata][occurrence]", occ)
    '
  }
}
