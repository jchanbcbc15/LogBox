# 50-validate.conf — backstop so an event without a parsed timestamp cannot be treated as data.
# Does not write to Elasticsearch or drop the event.
#
# Depends on the source date plugin in 30-parse-and-map setting Logstash-internal
# [@metadata][time_parsed] when conversion to @timestamp succeeds.
#
# If that flag is missing and tag _reject is not already present (for example the time
# field was absent, so date never ran), this file:
#   adds tag _reject
#   sets ECS error.type / error.message
#   sets metadata org.metadata.reject.stage to common.validate.required_fields
#
# The id => below is a label in Logstash logs. It is not written onto the event.
filter {
  if "_reject" not in [tags] and ![@metadata][time_parsed] {
    mutate {
      id => "common.validate.time"
      add_tag => ["_reject"]
      add_field => {
        "[org][metadata][reject][stage]" => "common.validate.required_fields"
        "[error][type]"    => "missing_field"
        "[error][message]" => "No parsed time on the event"
      }
    }
  }
}
