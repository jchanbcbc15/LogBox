# 60-doc-id.conf — give every event a stable Elasticsearch _id so a re-read overwrites
# the same document instead of creating a duplicate.
#
# This file writes one value: Logstash-internal [@metadata][doc_id], a SHA-256 digest
# (64 hex characters). Output copies that digest to the document _id.
# The inputs below are hashed; they are not stored as the id.
# The fingerprint plugin's source list is field paths on the event, so a year that
# lives only in an environment variable is copied onto the event first.
#
#   Proxy — ECS event.id is already set from the CSV event_id column
#     SHA-256 of event.dataset + event.id (source for the fingerprint plugin)
#     Two rows with the same event.id become one document; the later row wins.
#
#   Syslog — no event.id. RFC3164 lines have no year in the text, so the same line
#     from two operator years would otherwise share an _id. This branch copies
#     ASSUMED_YEAR onto [@metadata][assumed_year] and includes it in the hash.
#     SHA-256 of event.dataset + event.original + [@metadata][occurrence] +
#     [@metadata][assumed_year]
#     RFC5424 lines already have a year in event.original; they still use this
#     branch so syslog has one hash recipe.
#
#   Firewall — no event.id. CEF rt already includes a year (epoch or text).
#     SHA-256 of event.dataset + event.original + [@metadata][occurrence]
#
# The id => on each fingerprint plugin below (common.docid.fingerprint.event_id,
# common.docid.fingerprint.syslog, common.docid.fingerprint) is only a label in
# Logstash logs. It is not written onto the event.
filter {
  if [event][id] {
    fingerprint {
      id => "common.docid.fingerprint.event_id"
      source => ["[event][dataset]", "[event][id]"]
      concatenate_sources => true
      method => "SHA256"
      target => "[@metadata][doc_id]"
    }
  } else if [event][dataset] == "logbox.syslog" {
    mutate {
      id => "common.docid.assumed_year"
      add_field => { "[@metadata][assumed_year]" => "${ASSUMED_YEAR:}" }
    }
    fingerprint {
      id => "common.docid.fingerprint.syslog"
      source => ["[event][dataset]", "[event][original]", "[@metadata][occurrence]", "[@metadata][assumed_year]"]
      concatenate_sources => true
      method => "SHA256"
      target => "[@metadata][doc_id]"
    }
  } else {
    fingerprint {
      id => "common.docid.fingerprint"
      source => ["[event][dataset]", "[event][original]", "[@metadata][occurrence]"]
      concatenate_sources => true
      method => "SHA256"
      target => "[@metadata][doc_id]"
    }
  }
}
