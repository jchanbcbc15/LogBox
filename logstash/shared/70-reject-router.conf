# 70-reject-router.conf — mark whether output should treat this event as data or a reject.
#
# An event is a reject when an earlier filter cannot trust it as data. In this
# pipeline that is: the syslog header or time cannot be parsed; the firewall rt
# is missing or unparseable; the proxy row is not valid CSV or event_time is not
# a UTC time; 50-validate found no parsed timestamp; or a plugin failed and left
# _grokparsefailure, _dateparsefailure, _csvparsefailure, _kv_filter_error, or
# _rubyexception. Those steps tag _reject (or leave a plugin failure tag). This
# file does not decide those cases; it reads the tags. It does not write to
# Elasticsearch or drop the event.
#
# This file writes Logstash-internal [@metadata][route]:
#   rejects — tag _reject is present, or a plugin failure tag
#   data    — otherwise
#
# On a reject it also sets:
#   ECS event.kind = pipeline_error
#   @timestamp from ECS event.created (ingest time)
#   metadata org.metadata.reject.stage = unknown, if parse never set a stage
#
# The id => values below are labels in Logstash logs. They are not written onto the event.
filter {
  if "_reject" in [tags] or "_grokparsefailure" in [tags] or "_dateparsefailure" in [tags] or "_csvparsefailure" in [tags] or "_kv_filter_error" in [tags] or "_rubyexception" in [tags] {
    if ![org][metadata][reject][stage] {
      mutate {
        id => "common.reject.unknown"
        add_field => {
          "[org][metadata][reject][stage]" => "unknown"
          "[error][type]"    => "unknown"
          "[error][message]" => "A filter failed without recording its stage"
        }
      }
    }
    mutate {
      id => "common.reject.mark"
      replace   => { "[event][kind]" => "pipeline_error" }
      add_field => { "[@metadata][route]" => "rejects" }
      copy      => { "[event][created]" => "@timestamp" }
    }
  } else {
    mutate { id => "common.route.data" add_field => { "[@metadata][route]" => "data" } }
  }
}
