# 85-collector.conf — record who collected the event, not who produced it.
#
# This file writes:
#   ECS agent.name                    — LOGSTASH_INSTANCE (for example logstash-syslog)
#   metadata org.metadata.pipeline.host — PIPELINE_HOST (Ansible inventory hostname)
#
# Origin stays in ECS host.name or observer.hostname from the source parse.
#
# The id => below is a label in Logstash logs. It is not written onto the event.
filter {
  mutate {
    id => "common.collector"
    add_field => {
      "[agent][name]" => "${LOGSTASH_INSTANCE}"
      "[org][metadata][pipeline][host]" => "${PIPELINE_HOST}"
    }
  }
}
