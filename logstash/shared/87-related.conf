# 87-related.conf — copy values into ECS related.* so one search finds an IP, user or host
# wherever it appeared on the event.
#
# This file writes ECS arrays (copies, only if the source field exists):
#   related.ip    ← source.ip, destination.ip, client.ip
#   related.user  ← user.name, user.effective.name
#   related.hosts ← host.name, observer.hostname
#   related.hash  ← file.hash.sha256 (rarely set in this demo; CEF fileHash stays in metadata)
#
# The id => values below are labels in Logstash logs. They are not written onto the event.
filter {
  if [source][ip]      { mutate { id => "common.related.ip.source"      merge => { "[related][ip]" => "[source][ip]" } } }
  if [destination][ip] { mutate { id => "common.related.ip.destination" merge => { "[related][ip]" => "[destination][ip]" } } }
  if [client][ip]      { mutate { id => "common.related.ip.client"      merge => { "[related][ip]" => "[client][ip]" } } }
  if [user][name]           { mutate { id => "common.related.user"          merge => { "[related][user]" => "[user][name]" } } }
  if [user][effective][name] { mutate { id => "common.related.user.effective" merge => { "[related][user]" => "[user][effective][name]" } } }
  if [host][name]      { mutate { id => "common.related.hosts"          merge => { "[related][hosts]" => "[host][name]" } } }
  if [observer][hostname] { mutate { id => "common.related.hosts.observer" merge => { "[related][hosts]" => "[observer][hostname]" } } }
  if [file][hash][sha256] { mutate { id => "common.related.hash"           merge => { "[related][hash]" => "[file][hash][sha256]" } } }
}
