# 88-namespace.conf — apply the configured metadata namespace.
#
# Parse and shared filters already write leftovers under org.metadata.*.
# This file does not classify fields. It reads METADATA_NS (Ansible metadata_namespace).
#
#   default org — no change
#   any other value (for example acme) — rename the top-level org object
#     org.metadata.firewall.cat becomes acme.metadata.firewall.cat
#
# Logstash-internal @metadata.* is left as @metadata.
# Ruby is used because mutate/rename quotes an environment-substituted field name.
#
# The id => below is a label in Logstash logs. It is not written onto the event.
filter {
  if "${METADATA_NS:org}" != "org" {
    ruby {
      id => "common.namespace.rename"
      init => "@ns = ENV['METADATA_NS'].to_s"
      code => "obj = event.remove('[org]'); event.set('[' + @ns + ']', obj) unless obj.nil?"
    }
  }
}
