# 90-output.conf — write the event to Elasticsearch or Redis.
#
# DESTINATION (Ansible, default elasticsearch) selects the product.
# [@metadata][route] from 70-reject-router selects the index or list:
#   data    → logs-<dataset> (for example logs-logbox.syslog)
#   rejects → logs-rejects, plus one stdout line
#
# Elasticsearch: document _id is [@metadata][doc_id] from 60-doc-id.conf (action index,
# so a re-read overwrites). manage_template false: the playbook installs templates.
#
# Redis: the same JSON is appended to lists of those names. Redis has no document id,
# so a re-read appends. ${VAR:default} keeps this file valid when Redis is unused.
output {
  if "${DESTINATION:elasticsearch}" == "redis" {
    if [@metadata][route] == "rejects" {
      redis {
        id => "out.redis.rejects"
        host => ["${REDIS_HOST:redis}"]
        port => "${REDIS_PORT:6379}"
        password => "${REDIS_PASSWORD:}"
        data_type => "list"
        key => "logs-rejects"
        codec => json
      }
      stdout {
        id => "out.stdout.reject.redis"
        codec => line { format => "REJECT stage=%{[${METADATA_NS:org}][metadata][reject][stage]} dataset=%{[event][dataset]} doc_id=%{[@metadata][doc_id]}" }
      }
    } else {
      redis {
        id => "out.redis.data"
        host => ["${REDIS_HOST:redis}"]
        port => "${REDIS_PORT:6379}"
        password => "${REDIS_PASSWORD:}"
        data_type => "list"
        key => "logs-%{[event][dataset]}"
        codec => json
      }
    }
  } else {
    # CA file is always referenced: the plugin requires the path even when TLS is off.
    if [@metadata][route] == "rejects" {
      elasticsearch {
        id => "out.es.rejects"
        hosts => ["${ES_URL}"]
        user => "${ES_USER}"
        password => "${ES_PASSWORD}"
        ssl_enabled => "${ES_SSL:false}"
        ssl_certificate_authorities => ["${ES_CA_CERT:/certs/ca.crt}"]
        index => "logs-rejects"
        document_id => "%{[@metadata][doc_id]}"
        data_stream => "false"
        manage_template => false
        action => "index"
      }
      stdout {
        id => "out.stdout.reject"
        codec => line { format => "REJECT stage=%{[${METADATA_NS:org}][metadata][reject][stage]} dataset=%{[event][dataset]} doc_id=%{[@metadata][doc_id]}" }
      }
    } else {
      elasticsearch {
        id => "out.es.data"
        hosts => ["${ES_URL}"]
        user => "${ES_USER}"
        password => "${ES_PASSWORD}"
        ssl_enabled => "${ES_SSL:false}"
        ssl_certificate_authorities => ["${ES_CA_CERT:/certs/ca.crt}"]
        index => "logs-%{[event][dataset]}"
        document_id => "%{[@metadata][doc_id]}"
        data_stream => "false"
        manage_template => false
        action => "index"
      }
    }
  }
}
