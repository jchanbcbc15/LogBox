# firewall/10-input.conf — read the sample file into Logstash events.
#
# One CEF line is one record (plain codec, no multiline).
#
# sincedb /dev/null: every start reads from the first byte (safe because _id is deterministic).
# file_completed_action log: read mode would otherwise delete the file.
input {
  file {
    id   => "firewall.file.input"
    path => ["${INPUT_PATH}"]
    mode => "read"
    sincedb_path => "/dev/null"
    file_completed_action   => "log"
    file_completed_log_path => "/tmp/firewall-completed.log"
    codec => plain { charset => "UTF-8" }
  }
}
