# firewall/30-parse-and-map.conf — parse the syslog prefix and CEF line, unescape CEF sequences,
# map named keys to ECS.
#
# Input is one CEF line in message (10-input.conf, plain codec).
#
# Separators:
#   syslog prefix — spaces (time, host, then "CEF:")
#   CEF header    — pipe | between version, vendor, product, device version, signature, name, severity
#                   (an escaped \| inside a header field is not a separator)
#   extension     — key=value pairs; a new key starts at whitespace followed by word=
#                   (values may contain spaces; \= is an equals in a value, not a split)
#
# Contract (source token -> field). org.metadata.* is renamed if METADATA_NS is not org.
# Unknown extension keys stay under org.metadata.firewall.<key>.
#
#   syslog timestamp              org.metadata.firewall.syslog_timestamp
#   syslog host                   org.metadata.firewall.syslog_host
#   CEF version                   org.metadata.firewall.cef_version
#   vendor | product | version    observer.vendor, observer.product, observer.version
#   signature id                  event.code
#   name (CEF header)             message
#   severity                      org.metadata.firewall.severity (as written)
#   rt                            org.metadata.firewall.rt  and  @timestamp
#   dvchost                       observer.hostname
#   src / spt                     source.ip / source.port
#   dst / dpt                     destination.ip / destination.port
#   proto                         network.transport (lowercased)
#   act                           event.action
#   outcome                       event.outcome
#   suser                         user.name  and  source.user.name
#   msg                           event.reason
#   request                       url.original
#   requestClientApplication      user_agent.original
#   in / out                      source.bytes / destination.bytes
#   fname / filePath              file.name / file.path
#   cs1, cs2, cs3 and Labels      org.metadata.firewall.* (not rule.name / geo in this build)
#   fileHash, cat, other keys     org.metadata.firewall.*
#
# Constants: event.dataset = logbox.firewall, event.kind = event, observer.type = firewall.
# Reject (_reject) if the line is not CEF or rt is missing/unparseable.
# SOURCE_TIMEZONE (default UTC) applies only to zone-less text rt. ASSUMED_YEAR is not used.

filter {
  mutate {
    id => "firewall.mutate.dataset"
    add_field => {
      "[event][dataset]"  => "logbox.firewall"
      "[event][kind]"     => "event"
      "[observer][type]"  => "firewall"
    }
  }

  # ------------------------------------------------------------ syslog prefix + CEF header
  # A line is: syslog prefix, then CEF:0|vendor|product|version|signature id|name|severity|extension.
  # LBXHDR matches one header field: any text that is not a bare "|" or backslash, or a backslash
  # plus the next character (so an escaped \| inside a name does not end the field).
  # The prefix values are held in @metadata for now: the kv step below replaces the whole
  # org.metadata.firewall object, so they are moved in after it.
  grok {
    id => "firewall.grok.header"
    pattern_definitions => {
      "LBXHDR" => "(?:[^|\\]|\\.)*"
    }
    match => { "message" => "^%{SYSLOGTIMESTAMP:[@metadata][syslog_timestamp]} %{NOTSPACE:[@metadata][syslog_host]} CEF:%{INT:[@metadata][cef_version]}\|%{LBXHDR:[@metadata][vendor]}\|%{LBXHDR:[@metadata][product]}\|%{LBXHDR:[@metadata][dver]}\|%{LBXHDR:[@metadata][sig]}\|%{LBXHDR:[@metadata][name]}\|%{LBXHDR:[@metadata][severity]}\|%{GREEDYDATA:[@metadata][ext]}$" }
    tag_on_failure => ["_reject"]
  }
  if "_reject" in [tags] and ![org][metadata][reject][stage] {
    mutate { add_field => { "[org][metadata][reject][stage]" => "firewall.grok.header" "[error][type]" => "no_match" "[error][message]" => "Record did not match the syslog prefix and CEF header" } }
  }

  if "_reject" not in [tags] {
    # ---------------------------------------------------------------- extension key=value
    # A value runs up to the next " word=", so values may contain spaces. Every key lands under
    # org.metadata.firewall.<key>; the known ones are then moved to their ECS fields below, and
    # whatever is left stays where it is (nothing is dropped).
    # field_split_pattern: a new key starts at whitespace followed by "word=" (a look-ahead, which
    # consumes nothing). That is why a value may contain spaces, quotes and pipes. An "=" inside a
    # value is always escaped (\=), so it never looks like a key. include_brackets is off so
    # parentheses and brackets in a value (a user agent) are plain text.
    kv {
      id => "firewall.kv.extension"
      source => "[@metadata][ext]"
      target => "[org][metadata][firewall]"
      field_split_pattern => "\s+(?=[A-Za-z0-9_.]+=)"
      value_split => "="
      include_brackets => false
      tag_on_failure => ["_reject"]
    }
    if "_reject" in [tags] and ![org][metadata][reject][stage] {
      mutate { add_field => { "[org][metadata][reject][stage]" => "firewall.kv.extension" "[error][type]" => "no_match" "[error][message]" => "Extension could not be split into key=value pairs" } }
    }
  }

  if "_reject" not in [tags] {
    # kv replaced the whole org.metadata.firewall object, so the header leftovers are added now
    mutate {
      id => "firewall.mutate.header_leftovers"
      rename => {
        "[@metadata][syslog_timestamp]" => "[org][metadata][firewall][syslog_timestamp]"
        "[@metadata][syslog_host]"      => "[org][metadata][firewall][syslog_host]"
        "[@metadata][cef_version]"      => "[org][metadata][firewall][cef_version]"
      }
    }
    # Severity is kept as written under org.metadata (simplification-plan-2026-11-01.md: no conversion to
    # event.severity in this build)
    mutate { id => "firewall.mutate.severity" rename => { "[@metadata][severity]" => "[org][metadata][firewall][severity]" } }
  }

  if "_reject" not in [tags] {
    # Undo CEF escapes after the key=value split (so \= never starts a new key).
    # Header: \| \\. Extension: \n \r \= \\. Ruby walks one backslash-plus-next-character at a time;
    # a global replace of \n would also split paths such as C:\\Users\\nguyễn.an. Unknown escapes
    # are left as written. Failure tags _rubyexception so the event is rejected.
    ruby {
      id => "firewall.ruby.unescape"
      code => '
        # character after the backslash => the character it stands for
        header_escapes = { "|" => "|", "\\" => "\\" }
        value_escapes  = { "n" => "\n", "r" => "\r", "=" => "=", "\\" => "\\" }
        # find each backslash plus the next character; replace the pair using the table, and leave
        # a pair that is not in the table (an unknown escape such as \s) exactly as it was
        undo = lambda { |text, table| text.gsub(/\\(.)/m) { table.fetch($1, $&) } }
        %w[vendor product dver sig name].each do |key|
          field = "[@metadata][#{key}]"
          text = event.get(field)
          event.set(field, undo.call(text, header_escapes)) if text.is_a?(String)
        end
        values = event.get("[org][metadata][firewall]")
        if values.is_a?(Hash)
          values.keys.each do |key|
            field = "[org][metadata][firewall][#{key}]"
            text = event.get(field)
            event.set(field, undo.call(text, value_escapes)) if text.is_a?(String)
          end
        end
      '
    }

    # Header fields to ECS (after the escapes are undone, so the name is clean)
    mutate {
      id => "firewall.mutate.header"
      rename => {
        "[@metadata][vendor]"  => "[observer][vendor]"
        "[@metadata][product]" => "[observer][product]"
        "[@metadata][dver]"    => "[observer][version]"
        "[@metadata][sig]"     => "[event][code]"
      }
      replace => { "message" => "%{[@metadata][name]}" }
    }

    # ---------------------------------------------------------------- event time (rt)
    # rt is the device's time of the event and becomes @timestamp (decision in R22). Three cases:
    #   all digits  : epoch milliseconds, an exact instant, no zone needed       -> basis source-zone
    #   text        : "Oct 14 2026 00:06:43", has a year but no zone, so the zone is the operator's
    #                 SOURCE_TIMEZONE (UTC unless set); ASSUMED_YEAR is not needed -> basis assumed-zone
    #   missing or unreadable : the record is rejected, never given the ingest time
    # The original rt text stays in org.metadata.firewall.rt either way.
    if ![org][metadata][firewall][rt] {
      mutate { add_field => { "[org][metadata][reject][stage]" => "firewall.date.timestamp" "[error][type]" => "missing_field" "[error][message]" => "The CEF line has no rt (receipt time)" } add_tag => ["_reject"] }
    } else if [org][metadata][firewall][rt] =~ /^[0-9]+$/ {
      date {
        id => "firewall.date.epoch"
        match => ["[org][metadata][firewall][rt]", "UNIX_MS"]
        target => "@timestamp"
        tag_on_failure => ["_reject"]
        add_field => { "[@metadata][time_parsed]" => "true" "[org][metadata][pipeline][timestamp_basis]" => "source-zone" }
      }
    } else {
      date {
        id => "firewall.date.text"
        match => ["[org][metadata][firewall][rt]", "MMM dd yyyy HH:mm:ss", "MMM d yyyy HH:mm:ss"]
        locale => "en"
        timezone => "${SOURCE_TIMEZONE:UTC}"
        target => "@timestamp"
        tag_on_failure => ["_reject"]
        add_field => {
          "[@metadata][time_parsed]" => "true"
          "[org][metadata][pipeline][timestamp_basis]" => "assumed-zone"
          "[event][timezone]" => "${SOURCE_TIMEZONE:UTC}"
        }
      }
    }
    if "_reject" in [tags] and ![org][metadata][reject][stage] {
      mutate { add_field => { "[org][metadata][reject][stage]" => "firewall.date.timestamp" "[error][type]" => "invalid_time" "[error][message]" => "rt could not be converted to a date" } }
    }
  }

  if "_reject" not in [tags] {
    # ---------------------------------------------------------------- extension keys to ECS
    mutate {
      id => "firewall.mutate.rename"
      rename => {
        "[org][metadata][firewall][dvchost]"                  => "[observer][hostname]"
        "[org][metadata][firewall][src]"                      => "[source][ip]"
        "[org][metadata][firewall][spt]"                      => "[source][port]"
        "[org][metadata][firewall][dst]"                      => "[destination][ip]"
        "[org][metadata][firewall][dpt]"                      => "[destination][port]"
        "[org][metadata][firewall][proto]"                    => "[network][transport]"
        "[org][metadata][firewall][act]"                      => "[event][action]"
        "[org][metadata][firewall][outcome]"                  => "[event][outcome]"
        "[org][metadata][firewall][suser]"                    => "[user][name]"
        "[org][metadata][firewall][msg]"                      => "[event][reason]"
        "[org][metadata][firewall][request]"                  => "[url][original]"
        "[org][metadata][firewall][requestClientApplication]" => "[user_agent][original]"
        "[org][metadata][firewall][in]"                       => "[source][bytes]"
        "[org][metadata][firewall][out]"                      => "[destination][bytes]"
        "[org][metadata][firewall][fname]"                    => "[file][name]"
        "[org][metadata][firewall][filePath]"                 => "[file][path]"
      }
    }
    # Types are fixed after the renames (a rename keeps the string). ECS wants ports and byte counts
    # as numbers and the transport name in lower case ("TCP" becomes "tcp").
    mutate {
      id => "firewall.mutate.types"
      convert => { "[source][port]" => "integer" "[destination][port]" => "integer" "[source][bytes]" => "integer" "[destination][bytes]" => "integer" }
      lowercase => ["[network][transport]"]
    }
    # The user is copied to source.user.name as well (CEF calls suser the source user), so
    # user.name works as one search across all sources and source.user.name stays correct.
    if [user][name] {
      mutate { id => "firewall.mutate.user" copy => { "[user][name]" => "[source][user][name]" } }
    }

    # Not mapped in this build (simplification-plan-2026-11-01.md, owner-approved): the custom string fields
    # (cs1..cs3 and their labels, i.e. rule, threat, geo), the file hash, and event.category / event.type
    # by signature id. The values stay under org.metadata.firewall (and in event.original).
  }
}
