# proxy/10-input.conf — read the sample file into Logstash events.
#
# A quoted notes cell may contain line breaks, so one CSV record can span several physical lines.
# A record starts at the header row or at a UTC timestamp plus comma; other lines join the previous
# record. Parse later rejects a glue that leaves a line break outside quotes.
#
# sincedb /dev/null: every start reads from the first byte (safe because _id is deterministic).
# file_completed_action log: read mode would otherwise delete the file.
input {
  file {
    id   => "proxy.file.input"
    path => ["${INPUT_PATH}"]
    mode => "read"
    sincedb_path => "/dev/null"
    file_completed_action   => "log"
    file_completed_log_path => "/tmp/proxy-completed.log"
    codec => multiline {
      pattern => "^(?:event_time,|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z,)"
      negate  => true
      what    => "previous"
      auto_flush_interval => 2
      charset => "UTF-8"
    }
  }
}
