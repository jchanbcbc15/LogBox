# proxy/30-parse-and-map.conf — parse one CSV record, convert event_time to @timestamp, map columns to ECS.
#
# Input is one CSV record in message (10-input.conf; multiline joins quoted notes).
#
# Separators:
#   column separator  — comma
#   quote             — double quote; "" inside a quoted cell is a literal quote
#   no backslash escapes (C:\Users and \n stay as typed)
#   expected header   — event_time,event_id,client_ip,username,display_name,http_method,url,
#                       status_code,bytes_sent,user_agent,referrer,category,notes
#   that header row is dropped; any other row starting event_time, is rejected
#
# Contract (CSV column -> field). org.metadata.* is renamed if METADATA_NS is not org.
#
#   event_time     org.metadata.proxy.event_time  and  @timestamp (must be ISO-8601 ending in Z)
#   event_id       event.id
#   client_ip      client.ip
#   username       user.name
#   display_name   user.full_name
#   http_method    http.request.method
#   url            url.original  (not split into scheme/domain/path in this build)
#   status_code    http.response.status_code (integer when all digits)
#   bytes_sent     org.metadata.proxy.bytes_sent (direction not stated)
#   user_agent     user_agent.original
#   referrer       http.request.referrer  ("-" means none; field omitted)
#   category       org.metadata.proxy.category
#   notes          org.metadata.proxy.notes
#   extra cells    org.metadata.proxy.column14, …
#
# Constants: event.dataset = logbox.proxy, event.kind = event, observer.type = proxy.
# Working message is removed after parse (event.original already holds the raw row).
# Reject (_reject) if the row is not this CSV or event_time cannot be parsed.
# No ASSUMED_YEAR or SOURCE_TIMEZONE.

filter {
  mutate {
    id => "proxy.mutate.dataset"
    add_field => {
      "[event][dataset]" => "logbox.proxy"
      "[event][kind]"    => "event"
      "[observer][type]" => "proxy"
    }
  }

  # ------------------------------------------------------------ the header row
  # The first row only names the columns. It is dropped here: it is not a record. If a row starts with "event_time,"
  # but is NOT exactly the expected header, the export changed (columns reordered or renamed) and every
  # value would be mapped to the wrong field, so that row is rejected instead of guessed at.
  if [message] == "event_time,event_id,client_ip,username,display_name,http_method,url,status_code,bytes_sent,user_agent,referrer,category,notes" {
    drop { id => "proxy.drop.header" }
  } else if [message] =~ /^event_time,/ {
    mutate {
      id => "proxy.mutate.header_changed"
      add_tag => ["_reject"]
      add_field => { "[org][metadata][reject][stage]" => "proxy.csv.record" "[error][type]" => "malformed_record" "[error][message]" => "Header row is not the expected 13 columns" }
    }
  }

  # ------------------------------------------------------------ line breaks outside quotes
  # A record may contain line breaks only inside a quoted cell. Take the text, cut out every quoted cell
  # ("..." with "" for a quote inside), and see if a line break is left. If so the multiline codec glued
  # a malformed row onto the previous record (CSV readers would silently ignore the extra row), so the
  # record is rejected, not half-read.
  if "_reject" not in [tags] {
    mutate {
      id => "proxy.mutate.unquoted.copy"
      copy => { "message" => "[@metadata][unquoted]" }
    }
    mutate {
      id => "proxy.mutate.unquoted.cut"
      gsub => ["[@metadata][unquoted]", '"(?:[^"]|"")*"', ""]
    }
    if [@metadata][unquoted] =~ /\n/ {
      mutate {
        id => "proxy.mutate.glued_rows"
        add_tag => ["_reject"]
        add_field => { "[org][metadata][reject][stage]" => "proxy.csv.record" "[error][type]" => "malformed_record" "[error][message]" => "Line break outside quotes: a row does not start with a UTC time" }
      }
    }
  }

  # ------------------------------------------------------------ split the 13 cells
  # The csv filter undoes standard CSV quoting: quoted cells may hold commas, line breaks and "" for a
  # quote. There is NO backslash escaping in CSV, so \t, \n and C:\Users stay exactly as typed (no
  # unescape step here, unlike the CEF source). skip_empty_columns: an empty cell creates no field.
  # Every cell lands under org.metadata.proxy.<column name>; the ones with an ECS name are moved below.
  if "_reject" not in [tags] {
    csv {
      id => "proxy.csv.record"
      source => "message"
      separator => ","
      quote_char => '"'
      skip_empty_columns => true
      columns => ["event_time", "event_id", "client_ip", "username", "display_name", "http_method", "url", "status_code", "bytes_sent", "user_agent", "referrer", "category", "notes"]
      target => "[org][metadata][proxy]"
    }
    # On failure the csv filter adds the tag _csvparsefailure (it has no tag_on_failure setting); turn that
    # into a proper reject with this stage. The shared router treats the bare tag as a reject too (backstop).
    if "_csvparsefailure" in [tags] {
      mutate { id => "proxy.mutate.csv.reject" add_tag => ["_reject"] }
    }
    if "_reject" in [tags] and ![org][metadata][reject][stage] {
      mutate { add_field => { "[org][metadata][reject][stage]" => "proxy.csv.record" "[error][type]" => "malformed_record" "[error][message]" => "Record could not be read as CSV (for example an unclosed quote)" } }
    }
  }

  # ------------------------------------------------------------ event time
  # event_time is UTC with a Z ("2026-10-14T00:02:15.973Z"). Nothing is assumed: a value that is not an
  # ISO 8601 UTC time is rejected instead of being given a default zone, and a missing time is rejected,
  # never given the ingest time. The original text stays in org.metadata.proxy.event_time.
  if "_reject" not in [tags] {
    if ![org][metadata][proxy][event_time] {
      mutate { add_field => { "[org][metadata][reject][stage]" => "proxy.date.timestamp" "[error][type]" => "missing_field" "[error][message]" => "The record has no event_time" } add_tag => ["_reject"] }
    } else if [org][metadata][proxy][event_time] !~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$/ {
      mutate { add_field => { "[org][metadata][reject][stage]" => "proxy.date.timestamp" "[error][type]" => "invalid_time" "[error][message]" => "event_time is not an ISO 8601 UTC time ending in Z" } add_tag => ["_reject"] }
    } else {
      date {
        id => "proxy.date.timestamp"
        match => ["[org][metadata][proxy][event_time]", "ISO8601"]
        target => "@timestamp"
        tag_on_failure => ["_reject"]
        add_field => { "[@metadata][time_parsed]" => "true" "[org][metadata][pipeline][timestamp_basis]" => "source-zone" }
      }
      if "_reject" in [tags] and ![org][metadata][reject][stage] {
        mutate { add_field => { "[org][metadata][reject][stage]" => "proxy.date.timestamp" "[error][type]" => "invalid_time" "[error][message]" => "event_time could not be converted to a date" } }
      }
    }
  }

  if "_reject" not in [tags] {
    # ---------------------------------------------------------------- columns to ECS
    # Left where they are (non-ECS, under org.metadata.proxy): event_time (original text), bytes_sent
    # (decision 1: direction not stated), category, notes.
    # A "-" referrer means "no referrer" (decision 2): removed, so http.request.referrer is only set
    # when there is a real URL.
    if [org][metadata][proxy][referrer] == "-" {
      mutate { id => "proxy.mutate.referrer.dash" remove_field => ["[org][metadata][proxy][referrer]"] }
    }
    mutate {
      id => "proxy.mutate.rename"
      rename => {
        "[org][metadata][proxy][event_id]"     => "[event][id]"
        "[org][metadata][proxy][client_ip]"    => "[client][ip]"
        "[org][metadata][proxy][username]"     => "[user][name]"
        "[org][metadata][proxy][display_name]" => "[user][full_name]"
        "[org][metadata][proxy][http_method]"  => "[http][request][method]"
        "[org][metadata][proxy][url]"          => "[url][original]"
        "[org][metadata][proxy][status_code]"  => "[http][response][status_code]"
        "[org][metadata][proxy][user_agent]"   => "[user_agent][original]"
        "[org][metadata][proxy][referrer]"     => "[http][request][referrer]"
      }
    }
    # Numbers: converted only when the text is all digits. Anything else stays as written (the index
    # template keeps such a document and just does not index the bad value, ignore_malformed).
    if [http][response][status_code] =~ /^[0-9]+$/ {
      mutate { id => "proxy.mutate.convert.status" convert => { "[http][response][status_code]" => "integer" } }
    }
    if [org][metadata][proxy][bytes_sent] =~ /^[0-9]+$/ {
      mutate { id => "proxy.mutate.convert.bytes" convert => { "[org][metadata][proxy][bytes_sent]" => "integer" } }
    }

    # URL parts and the constant event.category / event.type are NOT set in this build
    # (simplification-plan-2026-11-01.md, owner-approved): url.original keeps the URL as logged.

    # The raw record is in event.original; the proxy row has no message of its own (default), so the
    # working copy is removed instead of being shown as a message.
    mutate { id => "proxy.mutate.drop_message" remove_field => ["message"] }
  }
}
