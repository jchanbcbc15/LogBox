# syslog/10-input.conf — read the sample file into Logstash events.
#
# A new record starts at an RFC3164 timestamp or an RFC5424 priority.
# Every other line (Java stack traces) is joined to the previous record.
#
# sincedb /dev/null: every start reads from the first byte (safe because _id is deterministic).
# file_completed_action log: read mode would otherwise delete the file.
input {
  file {
    id   => "syslog.file.input"
    path => ["${INPUT_PATH}"]
    mode => "read"
    sincedb_path => "/dev/null"
    file_completed_action   => "log"
    file_completed_log_path => "/tmp/syslog-completed.log"
    codec => multiline {
      pattern => "^(?:[A-Z][a-z]{2} +[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2} |<[0-9]+>1 )"
      negate  => true
      what    => "previous"
      # Last record has no following header; flush after 2 seconds or it would never be indexed.
      auto_flush_interval => 2
      charset => "UTF-8"
    }
  }
}
