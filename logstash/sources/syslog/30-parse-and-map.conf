# syslog/30-parse-and-map.conf — parse the syslog header, set @timestamp, map envelope fields to ECS.
#
# Input is one record in message (10-input.conf). Two header shapes; the first token chooses the
# branch. The body after the header is not parsed per program.
#
# Separators:
#   RFC5424 — spaces between header fields; priority in <n>; NILVALUE is "-";
#             structured data is [id k="v" …] (space-separated key="value" inside the brackets).
#   RFC3164 — spaces between time, host, and optional program[pid]:; then the rest is the body.
#
# Contract (source token -> field). org.metadata.* is renamed if METADATA_NS is not org.
#
#   RFC5424  (line starts with "<PRI>1 ")
#   <PRI>                         log.syslog.priority (then facility/severity via syslog_pri)
#   version                       log.syslog.version
#   timestamp                     org.metadata.syslog.timestamp  and  @timestamp (ISO-8601)
#   hostname                      host.name
#   app-name                      process.name
#   procid                        process.pid (integer, or dropped if not digits)
#   msgid                         log.syslog.msgid
#   structured data id            org.metadata.syslog.sd_id
#   SD user=                      log.syslog.structured_data.user  and  user.name
#   SD eventSource=               log.syslog.structured_data.eventSource
#   SD note=                      log.syslog.structured_data.note
#   body after SD                 message
#   timestamp_basis               org.metadata.pipeline.timestamp_basis = source-zone
#
#   RFC3164  (line starts with "Oct 14 00:02:17")
#   timestamp (no year/zone)      org.metadata.syslog.timestamp  and  @timestamp
#                                 (ASSUMED_YEAR prepended; SOURCE_TIMEZONE, default UTC)
#   hostname                      host.name
#   program                       process.name (optional)
#   pid                           process.pid (optional)
#   remainder                     message
#   timestamp_basis               org.metadata.pipeline.timestamp_basis = assumed-zone-and-year
#   event.timezone                SOURCE_TIMEZONE when year/zone were assumed
#
# Constants: event.dataset = logbox.syslog, event.kind = event.
# Reject (_reject) if the header or time cannot be trusted.
#
# ASSUMED_YEAR is required (RFC3164 has no year). SOURCE_TIMEZONE defaults to UTC.

filter {
  mutate {
    id => "syslog.mutate.dataset"
    add_field => {
      "[event][dataset]"  => "logbox.syslog"
      "[event][kind]"     => "event"
    }
  }

  # Two header formats share the file. RFC5424 lines start "<PRI>1 " (priority and version), RFC3164
  # lines start with a time "Oct 14 00:02:17". The branch is chosen by that first token.
  # Rule for the whole file: a record is rejected only when no trustworthy time can be obtained
  # (the header grok or the date step fails). Anything after that is best effort.
  # ------------------------------------------------------------------ RFC5424
  if [message] =~ /^<[0-9]+>1 / {
    # RFC5424 header grok: positional fields in order, not a generic key=value split.
    # It pulls PRI, version, timestamp, host, app, pid, msgid, then either "-" (no SD) or the
    # whole structured-data blob into [@metadata][sd], then the remainder into [@metadata][body].
    # The SD blob is still one string, for example [id user="x" note="y"].
    # LBXSD is our grok pattern name (LBX = logbox, SD = structured data): one or more [ … ]
    # groups so escaped \] inside a value does not end the block. It is not an RFC or ECS name.
    grok {
      id => "syslog.grok.header5424"
      pattern_definitions => {
        "LBXSD" => "(?:\[(?:[^\]\\]|\\.)*\])+"
      }
      match => { "message" => "(?m)^<%{POSINT:[log][syslog][priority]:int}>%{POSINT:[log][syslog][version]} %{NOTSPACE:[org][metadata][syslog][timestamp]} %{NOTSPACE:[host][name]} %{NOTSPACE:[process][name]} %{NOTSPACE:[process][pid]} %{NOTSPACE:[log][syslog][msgid]} (?:-|%{LBXSD:[@metadata][sd]})(?: %{GREEDYDATA:[@metadata][body]})?$" }
      tag_on_failure => ["_reject"]
    }
    if "_reject" in [tags] and ![org][metadata][reject][stage] {
      mutate { add_field => { "[org][metadata][reject][stage]" => "syslog.grok.header5424" "[error][type]" => "no_match" "[error][message]" => "Record did not match the RFC5424 header" } }
    }

    if "_reject" not in [tags] {
      # The PRI number is facility*8 + severity. This filter splits it into the ECS facility and
      # severity code and name fields (log.syslog.*). RFC3164 lines carry no PRI, so they get none.
      syslog_pri {
        id => "syslog.syslog_pri"
        syslog_pri_field_name => "[log][syslog][priority]"
      }
      date {
        id => "syslog.date.timestamp5424"
        match => ["[org][metadata][syslog][timestamp]", "ISO8601"]
        target => "@timestamp"
        tag_on_failure => ["_reject"]
        add_field => { "[@metadata][time_parsed]" => "true" }
      }
      if "_reject" in [tags] and ![org][metadata][reject][stage] {
        mutate { add_field => { "[org][metadata][reject][stage]" => "syslog.date.timestamp" "[error][type]" => "invalid_time" "[error][message]" => "Time could not be converted to a date" } }
      }
    }

    if "_reject" not in [tags] {
      mutate {
        id => "syslog.mutate.basis5424"
        add_field => { "[org][metadata][pipeline][timestamp_basis]" => "source-zone" }
      }
      if [process][pid] =~ /^[0-9]+$/ {
        mutate { id => "syslog.mutate.pid5424" convert => { "[process][pid]" => "integer" } }
      } else {
        mutate { id => "syslog.mutate.nopid5424" remove_field => ["[process][pid]"] }
      }
      mutate {
        id => "syslog.mutate.message5424"
        replace => { "message" => "%{[@metadata][body]}" }
      }
      # Structured data: [@metadata][sd] is still one string. Pull only known parameters with grok
      # (kv does not honour RFC5424 backslash escapes). Unknown keys stay in the blob / event.original.
      if [@metadata][sd] {
        grok { id => "syslog.sd.id"    pattern_definitions => { "LBXSDVAL" => "(?:[^\"\\]|\\.)*" } match => { "[@metadata][sd]" => "^\[%{NOTSPACE:[org][metadata][syslog][sd_id]} " } tag_on_failure => [] }
        grok { id => "syslog.sd.user"  pattern_definitions => { "LBXSDVAL" => "(?:[^\"\\]|\\.)*" } match => { "[@metadata][sd]" => " user=\"%{LBXSDVAL:[log][syslog][structured_data][user]}\"" } tag_on_failure => [] }
        grok { id => "syslog.sd.source" pattern_definitions => { "LBXSDVAL" => "(?:[^\"\\]|\\.)*" } match => { "[@metadata][sd]" => " eventSource=\"%{LBXSDVAL:[log][syslog][structured_data][eventSource]}\"" } tag_on_failure => [] }
        grok { id => "syslog.sd.note"  pattern_definitions => { "LBXSDVAL" => "(?:[^\"\\]|\\.)*" } match => { "[@metadata][sd]" => " note=\"%{LBXSDVAL:[log][syslog][structured_data][note]}\"" } tag_on_failure => [] }
        if [log][syslog][structured_data][note] {
          # undo the RFC5424 escapes: \" -> "   \] -> ]   \\ -> \
          mutate {
            id => "syslog.sd.unescape"
            gsub => [
              "[log][syslog][structured_data][note]", '\\"', '"',
              "[log][syslog][structured_data][note]", '\\\]', ']',
              "[log][syslog][structured_data][note]", '(\\)\\{1}', '\1'
            ]
          }
        }
        if [log][syslog][structured_data][user] {
          mutate { id => "syslog.sd.user_copy" copy => { "[log][syslog][structured_data][user]" => "[user][name]" } }
        }
      }
    }

  # ------------------------------------------------------------------ RFC3164
  } else {
    # LBXPROG = the program name: everything up to a colon, a space or "[" (so "postfix/smtp" works).
    # The program and pid are optional: a line without them is still a valid record, and the text
    # after the header is kept as the message.
    grok {
      id => "syslog.grok.header3164"
      pattern_definitions => {
        "LBXPROG" => "[^\s:\[]+"
      }
      match => { "message" => "(?m)^%{SYSLOGTIMESTAMP:[org][metadata][syslog][timestamp]} %{NOTSPACE:[host][name]} (?:%{LBXPROG:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: ?)?%{GREEDYDATA:[@metadata][body]}" }
      tag_on_failure => ["_reject"]
    }
    if "_reject" in [tags] and ![org][metadata][reject][stage] {
      mutate { add_field => { "[org][metadata][reject][stage]" => "syslog.grok.header3164" "[error][type]" => "no_match" "[error][message]" => "Record did not match the RFC3164 header" } }
    }

    if "_reject" not in [tags] {
      # RFC3164 times have no year and no zone, and the date filter would silently assume the current
      # year. The year comes from the operator (ASSUMED_YEAR, no default) and is put in front of the
      # text so the date filter parses a complete value. Two patterns because syslog pads a one-digit
      # day with an extra space ("Oct  4"). The zone is SOURCE_TIMEZONE, UTC unless set.
      mutate {
        id => "syslog.mutate.ts_text"
        add_field => { "[@metadata][ts_text]" => "${ASSUMED_YEAR} %{[org][metadata][syslog][timestamp]}" }
      }
      date {
        id => "syslog.date.timestamp3164"
        match => ["[@metadata][ts_text]", "yyyy MMM d HH:mm:ss", "yyyy MMM  d HH:mm:ss"]
        locale => "en"
        timezone => "${SOURCE_TIMEZONE:UTC}"
        target => "@timestamp"
        tag_on_failure => ["_reject"]
        add_field => { "[@metadata][time_parsed]" => "true" }
      }
      if "_reject" in [tags] and ![org][metadata][reject][stage] {
        mutate { add_field => { "[org][metadata][reject][stage]" => "syslog.date.timestamp" "[error][type]" => "invalid_time" "[error][message]" => "Time could not be converted to a date" } }
      }
    }

    if "_reject" not in [tags] {
      mutate {
        id => "syslog.mutate.basis3164"
        add_field => {
          "[org][metadata][pipeline][timestamp_basis]" => "assumed-zone-and-year"
          "[event][timezone]" => "${SOURCE_TIMEZONE:UTC}"
        }
        replace => { "message" => "%{[@metadata][body]}" }
      }

      # Body after the header stays in message. Per-program parsing is out of demo scope.
    }
  }
}
